<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>LancePrime</title>

<style>
  :root { --bg:#0b0d17; --card:#12152a; --txt:#e8e9f3; --muted:#9aa0b8; --gold:#d4af5f; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px;
         background:var(--bg); color:var(--txt); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; text-align:center; }
  .box { max-width:420px; width:100%; }
  img { width:160px; height:160px; object-fit:contain; margin-bottom:24px; }
  h1 { font-size:28px; letter-spacing:.5px; margin-bottom:12px; }
  p { color:var(--muted); font-size:16px; line-height:1.5; margin-bottom:28px; }
  a.btn { display:inline-block; padding:14px 28px; border-radius:999px; background:#25d366; color:#06240f;
          font-weight:700; text-decoration:none; font-size:16px; }
  a.btn:hover { filter:brightness(1.05); }
</style>
</head>
<body>
  <main class="box">
    <img src="/assets/logo-512.png" alt="LancePrime">
    <h1>Em breve</h1>
    <p>Estamos preparando novidades por aqui.<br>Enquanto isso, fale com a gente pelo WhatsApp.</p>
    <a class="btn" href="https://wa.me/5519981916024" target="_blank" rel="noopener">Chamar no WhatsApp</a>
  </main>
</body>
</html>
